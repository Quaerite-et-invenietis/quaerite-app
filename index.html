<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quaerite!</title>
<link href="manifest.json" rel="manifest"/>
<meta content="#131313" name="theme-color"/>
<!-- iOS : comportement app installée -->
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="Quaerite!" name="apple-mobile-web-app-title"/>
<link href="icon-180.png" rel="apple-touch-icon"/>
<link href="icon-192.png" rel="icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg: #131313; /* Dark background */
    --card-bg: #2a2a2a;
    --ink: #e5e2e1;
    --ink-soft: #c4c5d6;
    --ink-faint: #8e90a0;
    --line: #444654;
    --accent: #b8c4ff; /* Primary */
    --accent-light: #002585; /* On Primary slightly darker */
    --correct-bg: #00513a; /* Darker green */
    --correct-text: #67fcc6;
    --wrong-bg: #93000a;
    --wrong-text: #ffdad6;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  .top-bar {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 0 8px;
  }
  
  .history-banner {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    width: 100%;
  }
  .history-back {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .history-back:hover { color: var(--ink); border-color: var(--ink-faint); }
  .history-date {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
  }

  .progress-container {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-count {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 40px;
    text-align: right;
  }

  .deck-area {
    position: relative;
    width: 100%;
    max-width: 420px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .deck {
    position: relative;
    width: 100%;
    flex: 1;
  }

  .stack-edge {
    position: absolute;
    left: 12px;
    right: 12px;
    height: 16px;
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 24px 24px;
    background: var(--card-bg);
    display: none;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  }
  .stack-edge.e1 { bottom: -10px; z-index: 1; opacity: 0.8; }
  .stack-edge.e2 { bottom: -20px; left: 24px; right: 24px; z-index: 0; opacity: 0.5; }
  .stack-edge.visible { display: block; }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  }

  .ref-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .ref-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .part-tag {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    border: none;
    border-radius: 12px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .part-tag:hover { background: var(--accent); color: var(--bg); }
  .ref {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 0;
  }
  .arbo-path {
    display: none;
    margin-bottom: 24px;
    background: var(--bg);
    padding: 12px 16px;
    border-radius: 16px;
  }
  .arbo-path.show {
    display: block;
    animation: reveal 0.3s ease;
  }
  .arbo-level {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  .arbo-level:last-child {
    color: var(--ink);
    font-weight: 600;
  }

  .question {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 32px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .choice {
    text-align: left;
    background: var(--bg);
    border: 2px solid transparent;
    border-radius: 20px;
    padding: 16px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .choice:hover:not(.locked) { border-color: var(--ink-faint); }
  .choice.correct { 
    background: var(--correct-bg); 
    border-color: var(--correct-bg);
    color: var(--correct-text); 
  }
  .choice.wrong { 
    background: var(--wrong-bg); 
    border-color: var(--wrong-bg);
    color: var(--wrong-text);
  }
  .choice.dimmed { opacity: 0.5; }

  .explanation {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: none;
  }
  .explanation.show { display: block; animation: reveal 0.4s ease; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explanation .exp-text {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.6;
  }

  .deepen {
    margin-top: 16px;
  }
  .deepen-toggle {
    background: none;
    border: none;
    padding: 8px 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
  }
  .deepen-toggle:hover { opacity: 0.8; }
  .deepen-toggle .glyph {
    font-size: 16px;
    line-height: 1;
    font-weight: bold;
  }
  .deepen-body {
    display: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin-top: 12px;
    padding: 16px;
    background: var(--bg);
    border-radius: 16px;
  }
  .deepen-body.show { display: block; animation: reveal 0.3s ease; }

  .nav-controls {
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  
  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
    border-radius: 24px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
  }
  .nav-btn.secondary {
    background: var(--bg);
    color: var(--ink-soft);
  }
  .nav-btn.primary {
    background: var(--accent);
    color: var(--bg);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
  }
  .nav-btn.primary.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .nav-btn:hover:not(:disabled) { transform: scale(0.98); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .nav-btn svg { width: 20px; height: 20px; }

  /* ---- écran de fin ---- */
  .endview {
    display: none;
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 48px 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }
  .endview.show { display: block; animation: reveal 0.4s ease; }
  .end-icon {
    width: 80px;
    height: 80px;
    background: var(--correct-bg);
    color: var(--correct-text);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .end-icon svg { width: 40px; height: 40px; }
  .endview .msg {
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .endview .sub {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 32px;
  }

  /* ---- historique 7 jours ---- */
  .week-history {
    display: flex;
    justify-content: space-between;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .week-dot-btn {
    background: none;
    border: none;
    padding: 8px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .week-dot-btn:disabled { cursor: default; }
  .week-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-faint);
  }
  .week-dot-btn.today .week-label { color: var(--ink); }
  .week-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .week-dot.done { background: var(--accent); color: var(--bg); }
  .week-dot.future { opacity: 0.5; border: 1px dashed var(--ink-faint); background: transparent; }
  .week-dot-btn:not(:disabled):hover .week-dot { transform: scale(1.1); }

  /* ---- zone de test ---- */
  .testbar {
    margin-top: 40px;
    width: 100%;
    max-width: 420px;
  }
  .warning {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    line-height: 1.5;
  }

  @media (max-width: 460px) {
    .question { font-size: 20px; }
  }
</style>
<style>.arbo-level:nth-child(1) { padding-left: 0; } .arbo-level:nth-child(2) { padding-left: 8px; } .arbo-level:nth-child(3) { padding-left: 16px; } .arbo-level:nth-child(4) { padding-left: 24px; } .arbo-level:nth-child(5) { padding-left: 32px; }</style></head>
<body>
<div class="stage">
<div class="top-bar" id="topBar">
<div class="progress-container" id="progressContainer">
<div class="progress-bar-bg">
<div class="progress-bar-fill" id="progressBar"></div>
</div>
<div class="progress-count" id="progressCount"></div>
</div>
<div class="history-banner" id="historyBanner" style="display:none;">
<button class="history-back" id="historyBackBtn">‹ Retour</button>
<span class="history-date" id="historyDateLabel"></span>
</div>
</div>
<div class="deck-area" id="deckArea">
<div class="deck" id="deckWrap">
<div class="stack-edge e2" id="stackEdge2"></div>
<div class="stack-edge e1" id="stackEdge1"></div>
<div class="card" id="cardView">
<div class="ref-row">
<div class="ref-left">
<button class="part-tag" id="partTag" type="button"></button>
<span class="ref" id="reference"></span>
</div>
</div>
<div class="arbo-path" id="arboPath"></div>
<div class="question" id="question"></div>
<div class="choices" id="choices"></div>
<div class="explanation" id="explanation">
<div class="exp-text" id="explanationText"></div>
<div class="deepen">
<button class="deepen-toggle" id="deepenToggle"><span class="glyph" id="deepenGlyph">+</span><span>Détails</span></button>
<div class="deepen-body" id="deepenBody"></div>
</div>
</div>
</div>
</div>
<div class="nav-controls" id="navControls">
<button aria-label="Précédent" class="nav-btn secondary" id="prevBtn">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button aria-label="Suivant" class="nav-btn primary" id="nextBtn">
            Continuer
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
</div>
<div class="endview" id="endView">
<div class="end-icon">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<div class="msg">C'est fait pour aujourd'hui.</div>
<div class="sub">5 nouvelles cartes t'attendent demain.</div>
<div class="week-history" id="weekHistory"></div>
</div>
</div>
</div>
<script>
const todayCards = [
  {
    reference: "Écriture Sainte",
    part: "I.1.2.3",
    arbo: "Première partie : La profession de la foi › Première section : « Je crois » – « Nous croyons » › Chapitre deuxième : Dieu à la rencontre de l'homme › Article 3 : La Sainte Écriture › IV. Le Canon des Écritures",
    question: "Selon le CEC, combien de livres au total compose le canon catholique de la Bible (Ancien et Nouveau Testament réunis) ?",
    choices: ["66", "73", "76", "81"],
    correct: 1,
    explanation: "Le CEC liste 46 livres pour l'Ancien Testament et 27 pour le Nouveau, soit 73 au total.",
    source: "CEC §120",
    more: "Le canon protestant en compte 66, en excluant les livres deutérocanoniques (comme 2 Maccabées ou la Sagesse)."
  },
  {
    reference: "Morale (loi naturelle)",
    part: "III.1.3.1",
    arbo: "Troisième partie : La vie dans le Christ › Première section : La vocation de l'homme, la vie dans l'Esprit › Chapitre troisième : Le salut de Dieu, la Loi et la Grâce › Article 1 : La loi morale › I. La loi morale naturelle",
    question: "Selon le CEC, quelle qualité fondamentale caractérise la loi morale naturelle ?",
    choices: [
      "Elle varie légitimement selon les cultures",
      "Elle est immuable et universelle",
      "Elle n'engage que les baptisés",
      "Elle a été abrogée par la grâce du Nouveau Testament"
    ],
    correct: 1,
    explanation: "Le CEC affirme qu'elle est « immuable » et que son autorité « s'étend à tous les hommes », même reniée elle ne peut être effacée du cœur de l'homme.",
    source: "CEC §1954-1958",
    more: "Seule son application concrète varie selon les époques et cultures — pas les principes eux-mêmes."
  },
  {
    reference: "Mariologie",
    part: "I.2.3.9",
    arbo: "Première partie : La profession de la foi › Deuxième section : La profession de la foi chrétienne › Chapitre troisième : Je crois en l'Esprit Saint › Article 9 : « Je crois à la Sainte Église catholique » › Paragraphe 6 : Marie, Mère du Christ, Mère de l'Église",
    question: "Le dogme de l'Assomption de la Vierge Marie a été proclamé par quel pape, en quelle année ?",
    choices: ["Pie IX, en 1854", "Pie XII, en 1950", "Jean XXIII, en 1962", "Léon XIII, en 1891"],
    correct: 1,
    explanation: "Le CEC cite la proclamation du dogme de l'Assomption par Pie XII en 1950.",
    source: "CEC §966",
    more: "À ne pas confondre avec l'Immaculée Conception (Pie IX, 1854), qui porte sur le début et non la fin de la vie de Marie."
  },
  {
    reference: "Sacrements",
    part: "II.2.1.3",
    arbo: "Deuxième partie : La célébration du mystère chrétien › Deuxième section : Les sept sacrements de l'Église › Chapitre premier : Les sacrements de l'initiation chrétienne › Article 3 : Le sacrement de l'Eucharistie › I. L'Eucharistie, source et sommet de la vie ecclésiale",
    question: "Le CEC, citant saint Thomas d'Aquin, qualifie l'Eucharistie parmi les sept sacrements comme quoi ?",
    choices: [
      "le premier sacrement reçu",
      "le sacrement des sacrements, fin de tous les autres",
      "un sacrement facultatif",
      "le seul sacrement renouvelable chaque jour"
    ],
    correct: 1,
    explanation: "« Tous les autres sacrements sont ordonnés à celui-ci comme à leur fin » — l'Eucharistie tient une place unique parmi les sept.",
    source: "CEC §1211",
    more: "Cette place centrale explique pourquoi elle est dite « source et sommet » de toute la vie de l'Église."
  },
  {
    reference: "Sacrements",
    part: "II.1.1.2",
    arbo: "Deuxième partie : La célébration du mystère chrétien › Première section : L'économie sacramentelle › Chapitre premier : Le mystère pascal dans le temps de l'Église › Article 2 : Le mystère pascal dans les sacrements de l'Église › II. Les sacrements de l'Église",
    question: "Quels sont les trois sacrements qui impriment un caractère indélébile et ne peuvent donc jamais être répétés ?",
    choices: [
      "Baptême, Eucharistie, Mariage",
      "Baptême, Confirmation, Ordre",
      "Confirmation, Pénitence, Onction des malades",
      "Ordre, Mariage, Onction des malades"
    ],
    correct: 1,
    explanation: "Baptême, Confirmation et Ordre laissent un « caractère » indélébile dans l'âme ; les autres sacrements peuvent, eux, être reçus plusieurs fois.",
    source: "CEC §1121",
    more: "L'Ordre comporte trois degrés — épiscopat, presbytérat, diaconat — mais seuls les deux premiers relèvent du sacerdoce ; le diaconat est un degré de service, distinct."
  }
];

// Lundi (weekHistory[0]) — 5 questions distinctes, vérifiées sur vatican.va
const mondayCards = [
  {
    reference: "Concile de Nicée, 325",
    part: "I.2.1.1",
    arbo: "Première partie : La profession de la foi › Deuxième section : La profession de la foi chrétienne › Chapitre premier : Je crois en Dieu le Père › Article 1 : « Je crois en Dieu le Père tout-puissant, créateur du ciel et de la terre » › Paragraphe 2 : Le Père",
    question: "Selon le CEC, qu'a confessé l'Église au premier concile œcuménique de Nicée, en 325, à propos du Fils ?",
    choices: [
      "Qu'il est une simple créature de Dieu",
      "Qu'il est « consubstantiel » au Père, un seul Dieu avec lui",
      "Qu'il n'a qu'une nature, purement divine",
      "Qu'il procède du Père et de l'Esprit"
    ],
    correct: 1,
    explanation: "Le CEC rapporte qu'à Nicée, l'Église a confessé le Fils « consubstantiel » (« homoousios ») au Père — un seul Dieu avec lui, contre l'arianisme qui en faisait une créature.",
    source: "CEC §242",
    more: "Le concile de Constantinople (381) reprendra et complétera cette expression dans le Symbole encore récité aujourd'hui."
  },
  {
    reference: "Sermon sur la montagne",
    part: "III.1.1.2",
    arbo: "Troisième partie : La vie dans le Christ › Première section : La vocation de l'homme, la vie dans l'Esprit › Chapitre premier : La dignité de la personne humaine › Article 2 : Notre vocation à la béatitude › I. Les béatitudes",
    question: "Combien de béatitudes le CEC recense-t-il, à la suite de Matthieu 5 ?",
    choices: ["5", "7", "8", "10"],
    correct: 2,
    explanation: "Le CEC cite la liste complète des béatitudes de Matthieu 5 : huit, des « pauvres de cœur » aux « persécutés pour la justice ».",
    source: "CEC §1716",
    more: "Le CEC précise qu'elles reprennent et accomplissent les promesses faites au peuple élu depuis Abraham, non plus ordonnées à une terre mais au Royaume des cieux."
  },
  {
    reference: "Vertus théologales",
    part: "III.1.1.7",
    arbo: "Troisième partie : La vie dans le Christ › Première section : La vocation de l'homme, la vie dans l'Esprit › Chapitre premier : La dignité de la personne humaine › Article 7 : Les vertus › II. Les vertus théologales",
    question: "Selon le CEC, combien de vertus théologales y a-t-il, et lesquelles ?",
    choices: [
      "Deux : la foi et la charité",
      "Trois : la foi, l'espérance et la charité",
      "Quatre : les mêmes que les vertus cardinales",
      "Sept, en comptant les dons de l'Esprit"
    ],
    correct: 1,
    explanation: "Le CEC cite 1 Corinthiens 13,13 : « il y a trois vertus théologales : la foi, l'espérance et la charité ».",
    source: "CEC §1813",
    more: "Contrairement aux vertus humaines acquises par l'effort, le CEC précise qu'elles sont « infusées par Dieu dans l'âme des fidèles »."
  },
  {

// --- Contenu disponible : pour l'instant 3 jours de cartes vérifiées (15 au total). ---
// L'app boucle dessus en attendant que d'autres lots de cartes soient ajoutés (jusqu'à 365).
const contentPool = [todayCards, mondayCards, wednesdayCards];

const LS_LAUNCH = 'quaerite_launch_date';
const LS_HISTORY = 'quaerite_history';

function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayISO() { return isoOf(new Date()); }

// Date de lancement PAR APPAREIL : le jour 1 démarre au premier lancement de chaque personne.
function getLaunchDate() {
  let v = localStorage.getItem(LS_LAUNCH);
  if (!v) { v = todayISO(); localStorage.setItem(LS_LAUNCH, v); }
  return v;
}
function daysBetween(fromISO, toISO) {
  const a = new Date(fromISO + 'T00:00:00');
  const b = new Date(toISO + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function getHistory() {
  try { return JSON.parse(localStorage.getItem(LS_HISTORY)) || {}; } catch (e) { return {}; }
}
function saveHistory(dateISO, score) {
  const h = getHistory();
  h[dateISO] = { done: true, score };
  localStorage.setItem(LS_HISTORY, JSON.stringify(h));
}

const launchDate = getLaunchDate();
const dayIndex = daysBetween(launchDate, todayISO());
const todayDeck = contentPool[((dayIndex % contentPool.length) + contentPool.length) % contentPool.length];

let cards = todayDeck;
let sessionAnswers = new Array(todayDeck.length).fill(null);
let scoreSaved = false;

let currentWeekData = [];
let viewingHistoryDay = null; // null = aujourd'hui, sinon un objet du tableau ci-dessus
let current = 0;
let answered = false;
const total = cards.length + 1;

const els = {
  topBar: document.getElementById('topBar'),
  progressContainer: document.getElementById('progressContainer'),
  progressBar: document.getElementById('progressBar'),
  deckWrap: document.getElementById('deckWrap'),
  cardView: document.getElementById('cardView'),
  endView: document.getElementById('endView'),
  stackEdge1: document.getElementById('stackEdge1'),
  stackEdge2: document.getElementById('stackEdge2'),
  reference: document.getElementById('reference'),
  partTag: document.getElementById('partTag'),
  arboPath: document.getElementById('arboPath'),
  progressCount: document.getElementById('progressCount'),
  question: document.getElementById('question'),
  choices: document.getElementById('choices'),
  explanation: document.getElementById('explanation'),
  explanationText: document.getElementById('explanationText'),
  deepenToggle: document.getElementById('deepenToggle'),
  deepenBody: document.getElementById('deepenBody'),
  deepenGlyph: document.getElementById('deepenGlyph'),
  navControls: document.getElementById('navControls'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  weekHistory: document.getElementById('weekHistory'),
  historyBanner: document.getElementById('historyBanner'),
  historyBackBtn: document.getElementById('historyBackBtn'),
  historyDateLabel: document.getElementById('historyDateLabel')
};

const DAY_LABELS = ['D', 'L', 'M', 'M', 'J', 'V', 'S']; // getDay() : 0 = dimanche

function buildWeekHistory() {
  const hist = getHistory();
  currentWeekData = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const iso = isoOf(d);
    const entry = hist[iso];
    currentWeekData.push({
      iso,
      label: DAY_LABELS[d.getDay()],
      date: d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }),
      done: !!(entry && entry.done),
      score: entry ? entry.score : 0,
      isToday: i === 0
    });
  }

  els.weekHistory.innerHTML = '';
  currentWeekData.forEach((day) => {
    const btn = document.createElement('button');
    btn.className = 'week-dot-btn' + (day.isToday ? ' today' : '');
    btn.disabled = !day.done;
    btn.setAttribute('aria-label', day.date + (day.done ? ` — ${day.score}/5` : ' — non fait'));

    const label = document.createElement('span');
    label.className = 'week-label';
    label.textContent = day.label;

    const dot = document.createElement('span');
    dot.className = 'week-dot' + (day.done ? ' done' : '');
    dot.textContent = day.done ? day.score : '';

    btn.appendChild(label);
    btn.appendChild(dot);
    btn.addEventListener('click', () => enterHistoryDay(day));
    els.weekHistory.appendChild(btn);
  });
}

function enterHistoryDay(day) {
  if (!day.done) return;
  viewingHistoryDay = day;
  const dIdxForDay = daysBetween(launchDate, day.iso);
  const poolIdx = ((dIdxForDay % contentPool.length) + contentPool.length) % contentPool.length;
  cards = contentPool[poolIdx];
  current = 0;
  render();
}

els.historyBackBtn.addEventListener('click', () => {
  viewingHistoryDay = null;
  cards = todayDeck;
  current = cards.length;
  render();
});

function updateProgress() {
    const pct = ((current) / cards.length) * 100;
    els.progressBar.style.width = pct + '%';
    els.progressCount.textContent = (current + 1) + '/' + cards.length;
}

function render() {
  answered = false;
  els.deepenBody.classList.remove('show');
  els.deepenGlyph.textContent = '+';
  els.nextBtn.classList.remove('show');

  if (current === cards.length) {
    els.deckWrap.style.display = 'none';
    els.navControls.style.display = 'none';
    els.topBar.style.display = 'none';
    els.endView.classList.add('show');

    if (viewingHistoryDay === null && !scoreSaved) {
      const score = sessionAnswers.reduce((n, ans, idx) => n + (ans === todayDeck[idx].correct ? 1 : 0), 0);
      saveHistory(todayISO(), score);
      scoreSaved = true;
    }
    buildWeekHistory();
  } else {
    els.endView.classList.remove('show');
    els.deckWrap.style.display = 'block';
    els.navControls.style.display = 'flex';
    els.topBar.style.display = 'flex';

    const c = cards[current];
    els.reference.textContent = c.reference;
    els.partTag.textContent = c.part;
    els.arboPath.innerHTML = '';

    const pathParts = c.arbo.split(' › ');
    pathParts.forEach((level, idx) => {
      const d = document.createElement('div');
      d.className = 'arbo-level';
      d.textContent = idx === 0 ? level : '› ' + level;
      els.arboPath.appendChild(d);
    });

    els.arboPath.classList.remove('show');
    els.question.textContent = c.question;

    els.choices.innerHTML = '';
    c.choices.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = text;
      btn.addEventListener('click', () => selectChoice(i));
      els.choices.appendChild(btn);
    });

    els.explanation.classList.remove('show');
    updateProgress();

    if (viewingHistoryDay !== null) {
      els.progressContainer.style.display = 'none';
      els.historyBanner.style.display = 'flex';
      els.historyDateLabel.textContent = viewingHistoryDay.date;
      els.stackEdge1.classList.remove('visible');
      els.stackEdge2.classList.remove('visible');
      selectChoice(c.correct);
    } else {
      els.progressContainer.style.display = 'flex';
      els.historyBanner.style.display = 'none';
      const remaining = cards.length - current - 1;
      els.stackEdge1.classList.toggle('visible', remaining >= 1);
      els.stackEdge2.classList.toggle('visible', remaining >= 2);
    }
  }

  els.prevBtn.disabled = current === 0;
}

function selectChoice(i) {
  if (answered) return;
  answered = true;
  const c = cards[current];

  if (viewingHistoryDay === null) {
    sessionAnswers[current] = i;
  }

  const buttons = els.choices.querySelectorAll('.choice');
  buttons.forEach((btn, idx) => {
    btn.classList.add('locked');
    if (idx === c.correct) btn.classList.add('correct');
    else if (idx === i) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  els.explanationText.textContent = c.explanation;
  els.deepenBody.textContent = c.more;
  els.explanation.classList.add('show');

  els.nextBtn.classList.add('show');
}

els.deepenToggle.addEventListener('click', () => {
  const nowShown = els.deepenBody.classList.toggle('show');
  els.deepenGlyph.textContent = nowShown ? '−' : '+';
});

els.partTag.addEventListener('click', () => {
  els.arboPath.classList.toggle('show');
});

els.prevBtn.addEventListener('click', () => { if (current > 0) { current--; render(); } });
els.nextBtn.addEventListener('click', () => { if (current < total - 1) { current++; render(); } });

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
